[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandoros"
version = "2.0.0"
description = "MANDOROS: Meta-Analysis Network for Data, Outcomes & Research Optimization Synthesis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "gradio>=4.0.0",
    "scipy>=1.10.0",
    "plotly>=5.15.0",
    "pypdf>=3.15.0",
    "pdfplumber>=0.10.0"
]
